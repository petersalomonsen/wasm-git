name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  detectonly:
    name: Detect use of .only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Detect use of .only
        run: |
          grep -rq --include '*.spec.js' \.only\( . && echo 'You have .only() in your tests!' && exit 1
          exit 0
  default:
    name: "Default"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Default
        run: |
          npm install
          npx playwright install-deps
          npx playwright install
          sh setup.sh
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 4.0.23
          ./emsdk activate 4.0.23
          cd ..
          source ./emsdk/emsdk_env.sh
          cd emscriptenbuild
          ./build.sh Release
          cd ..
          set -e
          npm run test
          npm run test-browser
  asyncify:
    name: Asyncify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Default
        run: |
          npm install
          npx playwright install-deps
          npx playwright install
          sh setup.sh
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 4.0.23
          ./emsdk activate 4.0.23
          cd ..
          source ./emsdk/emsdk_env.sh
          cd emscriptenbuild
          ./build.sh Release-async
          cd ..
          set -e
          npm run test-browser-async
  opfs:
    name: OPFS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: OPFS Build and Test
        run: |
          npm install
          npx playwright install-deps
          npx playwright install
          sh setup.sh
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 4.0.23
          ./emsdk activate 4.0.23
          cd ..
          source ./emsdk/emsdk_env.sh
          cd emscriptenbuild
          ./build.sh Release-opfs
          cd ..
          ln -s ../emscriptenbuild/libgit2/examples/lg2_opfs.js test-browser-opfs/lg2_opfs.js
          ln -s ../emscriptenbuild/libgit2/examples/lg2_opfs.wasm test-browser-opfs/lg2_opfs.wasm
          set -e
          npm run test-browser-opfs
