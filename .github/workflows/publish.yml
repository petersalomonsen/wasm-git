name: Publish
# Runs only on pushes to master (actual releases): it builds every variant with
# the same pinned Emscripten as CI (main.yml), runs the node test suite, and
# publishes to npm when the version changed. Pull requests are validated by the CI workflow (main.yml),
# which also packs the tarball and runs the browser tests against it.
on:
  push:
    branches: [ master ]
permissions:
  contents: write # create the GitHub release + tag after a successful npm publish
  id-token: write
jobs:
  default:
    name: "Publish"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Default
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install
          sh setup.sh
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 6.0.3
          ./emsdk activate 6.0.3
          cd ..
          source ./emsdk/emsdk_env.sh
          cd emscriptenbuild
          ./build.sh Release
          ./build.sh Release-async
          ./build.sh Release-opfs
          ./build.sh Release-opfs-async
          ./build.sh Release-opfs-jspi
          cd ..
          set -e
          # Node test suite (no browser). The browser/OPFS variants are validated
          # by the CI workflow (main.yml), which runs on the same master push, so
          # this job does not install playwright or re-run the browser tests —
          # that download intermittently hangs and is redundant here.
          npm run test
          export VERSION=`npm view wasm-git dist-tags.latest`
          export NEWVERSION=`node -p "require('./package.json').version"`
          echo $VERSION $NEWVERSION
          ./preparepublishnpm.sh
          # Only a real push to master publishes; merge_group (pre-merge gate)
          # always does a dry-run, never a real publish.
          if [[ "$VERSION" != "$NEWVERSION" && "$GITHUB_EVENT_NAME" = "push" ]]; then
            npm publish --provenance --access public
            # Announce the release on GitHub so watchers/stargazers are notified;
            # notes are generated from the PRs merged since the previous tag.
            gh release create "v$NEWVERSION" --target "$GITHUB_SHA" \
              --title "v$NEWVERSION" --generate-notes
          elif [[ "$VERSION" != "$NEWVERSION" ]]; then
            echo "version change is $VERSION->$NEWVERSION, event is $GITHUB_EVENT_NAME, not publishing, only dry-run"
            npm publish --dry-run
          else
            echo "version $VERSION is already published, skipping publish"
          fi
